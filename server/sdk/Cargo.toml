[package]
name = "duckfleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Async Rust client for DuckFleet: sessions, typed queries, Arrow results, and durable jobs"
license = "Apache-2.0"
repository = "https://github.com/athvin/duck-fleet"
documentation = "https://docs.rs/duckfleet"
readme = "README.md"
keywords = ["duckdb", "ducklake", "arrow", "sql", "client"]
categories = ["database", "api-bindings", "asynchronous"]
include = ["src/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
arrow-array = "60.0.0"
arrow-cast = "60.0.0"
arrow-ipc = "60.0.0"
arrow-schema = { version = "60.0.0", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "time", "macros"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1.54.1", features = ["full"] }
