[package]
name = "duckfleet-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "58.4.1"
arrow-cast = "58.4.1"
arrow-ipc = "58.4.1"
arrow-schema = "58.4.1"
axum = "0.8"
duckdb = "=1.10504.0"
postgres = "0.19.14"
# rustls, used with the built-in roots switched off: the only certificate the
# gateway trusts for the Kubernetes API is the cluster CA the kubelet mounts, which
# is tighter than the public root set a default build would accept.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Already in the tree via rustls; used directly for credential hashing, so issued
# tokens are stored and compared only as digests.
ring = "0.17"
# The provider is named explicitly rather than taken by default: the default is
# aws-lc, which needs cmake and a C toolchain, while ring is already in this tree
# by way of libduckdb-sys and so costs nothing to reuse.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
# `test-util` enables paused time, which is what lets the drain-wait tests cover a
# 75-second deadline without spending it. Tests only; the served binary keeps the
# feature set above.
tokio = { version = "1.54.1", features = ["full", "test-util"] }
