[package]
name = "duckfleet-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-ipc = "58.4.1"
axum = "0.8"
duckdb = "=1.10504.0"
postgres = "0.19.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
