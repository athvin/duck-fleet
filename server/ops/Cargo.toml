[package]
name = "duckfleet-ops"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-ipc = "60.0.0"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = "0.3.32"
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_yaml = "0.9"
shell-words = "1"
tempfile = "3"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
