name: retail_demo
version: '1.0.0'
config-version: 2
profile: duckfleet
model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
target-path: target
# Placement must work even when dbt's query comments are off, exactly as the
# platform's own harness runs.
query-comment: null

# Every model uses the shared persistent pool on Compose. Tags remain workload
# attribution and never size compute.
models:
  retail_demo:
    +meta:
      platform:
        tags:
          team: retail

seeds:
  retail_demo:
    customers:
      +column_types:
        customer_id: bigint
        name: varchar
        region: varchar
        tier: varchar
    orders:
      +column_types:
        order_id: bigint
        customer_id: bigint
        product: varchar
        amount: decimal(18,2)
        status: varchar
        ordered_at: timestamp
