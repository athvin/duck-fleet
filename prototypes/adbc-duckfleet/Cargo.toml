[package]
name = "adbc-duckfleet"
version = "0.0.1"
edition = "2024"
publish = false
description = "Prototype ADBC driver over DuckFleet's HTTP/Arrow API (discovery for #172; not a supported driver)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adbc_core = "0.25.0"
adbc_ffi = "0.25.0"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
duckfleet = { path = "../../server/sdk" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[workspace]
