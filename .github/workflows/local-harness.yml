name: Docker dbt harness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: local-harness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-rust.sh
      - name: Rust checks in Docker
        run: make check
      - name: Real dbt integration and restart checks
        run: make test
      - name: Native CLI project and real Compose smoke
        run: |
          cd server
          cargo build --locked -p duckfleet-cli
          cd ..
          make test-cli
      - name: Native CLI lifecycle and two-project isolation
        run: make test-dev
      - name: Interactive shell PTY and SQL input lifecycle
        run: make test-shell
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: duckfleet-local-harness
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local stack
        if: always()
        run: docker compose down -v

  # Runs beside the Compose harness rather than after it: this proves scheduling,
  # probes and real cgroup limits, which Compose cannot express at all.
  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-rust.sh
      - run: bash scripts/ci/install-infra-tools.sh
      - run: bash scripts/ci/install-kind.sh
      - name: Kubernetes release and in-cluster dbt harness
        run: make test-k8s
      - name: Save cluster evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: duckfleet-kind-harness
          path: artifacts/kind/
          if-no-files-found: ignore
          retention-days: 7
