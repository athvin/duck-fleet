name: Infrastructure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: bash scripts/ci/install-infra-tools.sh
      # duckfleet-ops' dependencies, which check-infra otherwise compiles cold each run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            server/target
          key: infra-ops-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: infra-ops-
      - run: make check-infra
# Pull requests remain credential-free; AWS mutation runs only after main checks pass.
