name: AWS development harness
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'docker/**'
      - 'tests/**'
      - 'scripts/**'
      - 'infra/terraform/**'
      - 'infra/helm/**'
      # The ownership boundary — the Role, the ResourceQuota, the NodePool — is what
      # this lane exercises when it places an isolated pod, so a change to it must be
      # able to trigger the lane. Omitting it meant a quota or NodePool edit shipped
      # with only the credential-free PR checks behind it.
      - 'infra/kubernetes/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      upgrade_legacy_database:
        description: Stop compute and run the one-time bundled PostgreSQL role/ownership upgrade
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: duckfleet-aws-dev
  cancel-in-progress: false
env:
  DUCKFLEET_CLUSTER: ${{ vars.DUCKFLEET_CLUSTER }}
  AWS_REGION: us-east-2
  KUBE_CONTEXT: duckfleet-ci-dev
  TF_IN_AUTOMATION: 'true'
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require checks on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/aws/wait-checks.py
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/duckfleet-ci-dev
          aws-region: us-east-2
      # The cluster comes from scripts/aws/target.env, which the deploy scripts also
      # read, so the workflow and the scripts cannot disagree about where this goes.
      - name: Resolve the deploy target
        run: |
          set -euo pipefail
          source scripts/aws/target.env
          : "${DUCKFLEET_CLUSTER:?Set the DUCKFLEET_CLUSTER repository variable}"
          echo "DUCKFLEET_CLUSTER=$DUCKFLEET_CLUSTER" >> "$GITHUB_ENV"
      - run: aws eks update-kubeconfig --name "$DUCKFLEET_CLUSTER" --alias "$KUBE_CONTEXT" --region "$AWS_REGION"
      - run: bash scripts/aws/check-access.sh
      - run: bash scripts/aws/apply.sh
  publish:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/duckfleet-ci-dev
          aws-region: us-east-2
      - run: bash scripts/aws/publish.sh "$IMAGE_ARCH"
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
  deploy:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      DUCKFLEET_UPGRADE_LEGACY_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.upgrade_legacy_database }}
    outputs:
      deployment_started: ${{ steps.start.outputs.deployment_started }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/ci/install-infra-tools.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/duckfleet-ci-dev
          aws-region: us-east-2
      - run: bash scripts/aws/assemble-images.sh
      # The cluster comes from scripts/aws/target.env, which the deploy scripts also
      # read, so the workflow and the scripts cannot disagree about where this goes.
      - name: Resolve the deploy target
        run: |
          set -euo pipefail
          source scripts/aws/target.env
          : "${DUCKFLEET_CLUSTER:?Set the DUCKFLEET_CLUSTER repository variable}"
          echo "DUCKFLEET_CLUSTER=$DUCKFLEET_CLUSTER" >> "$GITHUB_ENV"
      - run: aws eks update-kubeconfig --name "$DUCKFLEET_CLUSTER" --alias "$KUBE_CONTEXT" --region "$AWS_REGION"
      - id: start
        run: echo 'deployment_started=true' >> "$GITHUB_OUTPUT"
      - run: bash scripts/aws/deploy.sh
      - run: bash scripts/aws/test.sh
      - name: Upload verified fixture evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckfleet-aws-evidence
          path: artifacts/aws/evidence.json
          if-no-files-found: error
          retention-days: 14
      # Bounds the lake after the verdict is in, never blocking it. continue-on-error
      # is the guarantee a slow or interrupted sweep cannot fail a deploy; the script
      # exits 0 anyway, so this is belt and suspenders. Runs only on a green test —
      # a broken deploy goes straight to suspend.
      - name: Bound the development lake
        run: bash scripts/aws/maintain.sh
        continue-on-error: true
  suspend:
    needs: deploy
    if: always() && needs.deploy.outputs.deployment_started == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      KUBE_CONTEXT: duckfleet-ci-dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/ci/install-infra-tools.sh
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/duckfleet-ci-dev
          aws-region: us-east-2
      # The cluster comes from scripts/aws/target.env, which the deploy scripts also
      # read, so the workflow and the scripts cannot disagree about where this goes.
      - name: Resolve the deploy target
        run: |
          set -euo pipefail
          source scripts/aws/target.env
          : "${DUCKFLEET_CLUSTER:?Set the DUCKFLEET_CLUSTER repository variable}"
          echo "DUCKFLEET_CLUSTER=$DUCKFLEET_CLUSTER" >> "$GITHUB_ENV"
      - run: aws eks update-kubeconfig --name "$DUCKFLEET_CLUSTER" --alias "$KUBE_CONTEXT" --region "$AWS_REGION"
      - run: bash scripts/aws/suspend.sh
