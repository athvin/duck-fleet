name: Rust SDK
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.89.0", "1.99.0"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust ${{ matrix.toolchain }}
        working-directory: .
        run: |
          bash scripts/ci/install-rust.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Dependencies only: workspace crates rebuild every run, because a fresh checkout
      # is newer than any restored output.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            server/target
          key: sdk-${{ matrix.toolchain }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: sdk-${{ matrix.toolchain }}-
      - name: Format
        run: cargo +${{ matrix.toolchain }} fmt -p duckfleet -- --check
      - name: Clippy
        run: cargo +${{ matrix.toolchain }} clippy -p duckfleet --all-targets --locked -- -D warnings
      - name: Unit, transport, and documentation tests
        run: cargo +${{ matrix.toolchain }} test -p duckfleet --locked
      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc -p duckfleet --no-deps --locked
      - name: Package contents build standalone
        run: cargo +${{ matrix.toolchain }} package -p duckfleet --locked
