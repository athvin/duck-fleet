name: duckfleet-local
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: duckfleet
      POSTGRES_PASSWORD: ${DUCKFLEET_POSTGRES_ADMIN_PASSWORD:-local-administrator-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U duckfleet -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  object-store:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: DUCKFLEETLOCAL
      RUSTFS_SECRET_KEY: local-object-store-password
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes:
      - object-data:/data

  bucket-init:
    build:
      context: .
      dockerfile: docker/s3.Dockerfile
    depends_on: [object-store]

  platform-provision:
    image: postgres:17.6-bookworm
    entrypoint: [/bin/bash, /etc/duckfleet/provision-database.sh]
    environment: &database-provision-environment
      PGHOST: postgres
      POSTGRES_USER: duckfleet
      PGPASSWORD: ${DUCKFLEET_POSTGRES_ADMIN_PASSWORD:-local-administrator-password}
      DUCKFLEET_DB_MIGRATOR_ROLE: duckfleet_migrator
      DUCKFLEET_DB_GATEWAY_ROLE: duckfleet_gateway
      DUCKFLEET_DB_WORKER_ROLE: duckfleet_worker
      DUCKFLEET_DB_MAINTAINER_ROLE: duckfleet_maintainer
      DUCKFLEET_DB_CATALOG_ROLE: duckfleet_catalog
      DUCKFLEET_DB_MIGRATOR_PASSWORD: local-platform-migration-password
      DUCKFLEET_DB_GATEWAY_PASSWORD: local-platform-gateway-password
      DUCKFLEET_DB_WORKER_PASSWORD: local-platform-worker-password
      DUCKFLEET_DB_MAINTAINER_PASSWORD: local-platform-maintainer-password
      DUCKFLEET_DB_CATALOG_PASSWORD: local-lake-catalog-password
      # Explicit opt-in only after stop-compute for a pre-RBAC local volume.
      DUCKFLEET_ADOPT_DATABASE_OWNER: ${DUCKFLEET_ADOPT_DATABASE_OWNER:-no}
    volumes:
      - ./docker/provision-database.sh:/etc/duckfleet/provision-database.sh:ro
      - ./infra/helm/duckfleet/files/provision-database.sql:/etc/duckfleet/provision-database.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Explicit schema changes run once before compute, without DuckDB, S3, or a token.
  # After restoring/resetting platform, rerun: scripts/migrate-platform.sh compose
  platform-migrate:
    image: duckfleet-worker:local
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      DUCKFLEET_ROLE: migrate
      DUCKFLEET_NAMESPACE: local
      DUCKFLEET_DATABASE_ROLES_JSON: '{"gateway":"duckfleet_gateway","worker":"duckfleet_worker","maintainer":"duckfleet_maintainer"}'
      DUCKFLEET_AUTHZ_DEFAULT_POOL: small
      DUCKFLEET_AUTHZ_DEFAULT_CPU: "1"
      DUCKFLEET_AUTHZ_DEFAULT_MEMORY: 1Gi
      DUCKFLEET_AUTHZ_DEFAULT_DISK: 2Gi
      PLATFORM_DSN: host=postgres port=5432 dbname=platform user=duckfleet_migrator password=local-platform-migration-password
      DUCKFLEET_PLATFORM_WAIT_SECONDS: "120"
      DUCKFLEET_MIGRATION_TIMEOUT_SECONDS: "240"
    depends_on:
      platform-provision:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5
    restart: "no"

  # Legacy default pool. Resource-only requests still ask for isolation, which
  # needs Kubernetes; explicit persistent pools are available via the pools profile.
  worker-small:
    labels:
      duckfleet.io/platform-schema: "4"
    image: duckfleet-worker:local
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment: &worker-environment
      DUCKFLEET_NAMESPACE: local
      DUCKFLEET_INTERNAL_TOKEN: ${DUCKFLEET_INTERNAL_TOKEN:-duckfleet-local-internal-service-token}
      DUCKFLEET_WORKER_ID: small
      DUCKFLEET_POOL: small
      DUCKFLEET_WORKER_MAX_SESSIONS: "32"
      DUCKFLEET_WORKER_QUEUE_CAPACITY: "64"
      DUCKFLEET_WORKER_MAX_QUEUED_QUERIES: "64"
      DUCKFLEET_WORKER_MAX_QUEUED_BYTES: "16777216"
      DUCKFLEET_WORKER_CPU: "1"
      DUCKFLEET_WORKER_MEMORY: 1Gi
      DUCKFLEET_WORKER_DISK: 2Gi
      DUCKFLEET_PROFILING: ${DUCKFLEET_PROFILING:-true}
      # Pinned to the defaults so the harness's pricing evidence is deterministic.
      DUCKFLEET_RATE_CARD_VERSION: local-dev-1
      DUCKFLEET_COMPUTE_MICRO_USD_PER_UNIT_HOUR: "100000"
      DUCKFLEET_PLATFORM_WAIT_SECONDS: "120"
      CATALOG_DSN: host=postgres port=5432 dbname=lake user=duckfleet_catalog password=local-lake-catalog-password
      PLATFORM_DSN: host=postgres port=5432 dbname=platform user=duckfleet_worker password=local-platform-worker-password
      S3_ENDPOINT: object-store:9000
      S3_ACCESS_KEY: DUCKFLEETLOCAL
      S3_SECRET_KEY: local-object-store-password
      S3_DATA_PATH: s3://duckfleet/lake/
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
    healthcheck: &worker-health
      test: [CMD, curl, -fsS, http://localhost:8080/healthz]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 630s

  # A second worker of the same size, for the scale-out stage: same resources, its
  # own identity. Behind a profile so the default run keeps exactly one worker and
  # its deterministic placement assertions; the harness brings this up and points
  # the gateway at it via DUCKFLEET_WORKER_URLS.
  worker-small-b:
    labels:
      duckfleet.io/platform-schema: "4"
    profiles: [scale-out]
    image: duckfleet-worker:local
    environment:
      <<: *worker-environment
      DUCKFLEET_WORKER_ID: small-b
    depends_on:
      worker-small:
        condition: service_healthy
    healthcheck: *worker-health
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 630s

  server:
    labels:
      duckfleet.io/platform-schema: "4"
    image: duckfleet-worker:local
    environment:
      DUCKFLEET_ROLE: gateway
      DUCKFLEET_NAMESPACE: local
      DUCKFLEET_INTERNAL_TOKEN: ${DUCKFLEET_INTERNAL_TOKEN:-duckfleet-local-internal-service-token}
      DUCKFLEET_GATEWAY_MAX_SESSIONS: "64"
      DUCKFLEET_ADMISSION_LIMITS_JSON: "${DUCKFLEET_ADMISSION_LIMITS_JSON:-{}}"
      DUCKFLEET_PLATFORM_WAIT_SECONDS: "120"
      # The gateway coordinates bounded history retention for the whole fleet.
      DUCKFLEET_HISTORY_RETENTION_DAYS: "365"
      # The wire front is exercised by the harness; the port stays internal.
      DUCKFLEET_PGWIRE: "true"
      PLATFORM_DSN: host=postgres port=5432 dbname=platform user=duckfleet_gateway password=local-platform-gateway-password
      DUCKFLEET_MAINTENANCE_DSN: host=postgres port=5432 dbname=platform user=duckfleet_maintainer password=local-platform-maintainer-password
      DUCKFLEET_TOKEN: ${DUCKFLEET_TOKEN:-duckfleet-local-development-token}
      # The same card the workers price with; the gateway reports it on the budget.
      DUCKFLEET_RATE_CARD_VERSION: local-dev-1
      DUCKFLEET_COMPUTE_MICRO_USD_PER_UNIT_HOUR: "100000"
      # Endpoints, not classes: the gateway asks each worker what resources it has.
      # Overridable so the scale-out stage can add worker-small-b without editing
      # this file; the default is the single persistent worker everything else assumes.
      DUCKFLEET_WORKER_URLS: ${DUCKFLEET_WORKER_URLS:-http://worker-small:8080}
    ports:
      - '127.0.0.1:${DUCKFLEET_PORT:-18080}:8080'
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      worker-small:
        condition: service_started
    healthcheck: *worker-health
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 630s

  # An optional second allocation, independent of the legacy default and of
  # isolation. Start with: docker compose --profile pools up -d --wait server-pools
  worker-pool-interactive-0:
    labels:
      duckfleet.io/platform-schema: "4"
    profiles: [pools]
    image: duckfleet-worker:local
    environment:
      <<: *worker-environment
      DUCKFLEET_WORKER_ID: pool-interactive-0
      DUCKFLEET_POOL: interactive
      DUCKFLEET_WORKER_CPU: "2"
      DUCKFLEET_WORKER_MEMORY: 3Gi
      DUCKFLEET_WORKER_DISK: 4Gi
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
    healthcheck: *worker-health
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 630s

  server-pools:
    labels:
      duckfleet.io/platform-schema: "4"
    profiles: [pools]
    image: duckfleet-worker:local
    environment:
      DUCKFLEET_ROLE: gateway
      DUCKFLEET_NAMESPACE: local
      DUCKFLEET_INTERNAL_TOKEN: ${DUCKFLEET_INTERNAL_TOKEN:-duckfleet-local-internal-service-token}
      DUCKFLEET_GATEWAY_MAX_SESSIONS: "64"
      DUCKFLEET_ADMISSION_LIMITS_JSON: "${DUCKFLEET_ADMISSION_LIMITS_JSON:-{}}"
      DUCKFLEET_PLATFORM_WAIT_SECONDS: "120"
      DUCKFLEET_HISTORY_RETENTION_DAYS: "365"
      DUCKFLEET_PGWIRE: "true"
      PLATFORM_DSN: host=postgres port=5432 dbname=platform user=duckfleet_gateway password=local-platform-gateway-password
      DUCKFLEET_MAINTENANCE_DSN: host=postgres port=5432 dbname=platform user=duckfleet_maintainer password=local-platform-maintainer-password
      DUCKFLEET_TOKEN: ${DUCKFLEET_TOKEN:-duckfleet-local-development-token}
      DUCKFLEET_RATE_CARD_VERSION: local-dev-1
      DUCKFLEET_COMPUTE_MICRO_USD_PER_UNIT_HOUR: "100000"
      DUCKFLEET_POOLS_FILE: /etc/duckfleet/pools/compose.json
    volumes:
      # Mount the directory so atomic file replacements are visible on reload.
      - ${DUCKFLEET_POOLS_DIRECTORY:-./examples/pools}:/etc/duckfleet/pools:ro
    ports:
      - '127.0.0.1:${DUCKFLEET_POOLS_PORT:-18081}:8080'
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      worker-small:
        condition: service_started
      worker-pool-interactive-0:
        condition: service_started
    healthcheck: *worker-health
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 630s

  dbt:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    environment:
      DUCKFLEET_URL: http://server:8080
      DUCKFLEET_TOKEN: ${DUCKFLEET_TOKEN:-duckfleet-local-development-token}
      # Test-only fault injection for bounded auth reads and revocation while
      # admission waits on a database lock. Never part of the public client API.
      DUCKFLEET_INTERNAL_TEST_TOKEN: ${DUCKFLEET_INTERNAL_TOKEN:-duckfleet-local-internal-service-token}
      DUCKFLEET_PLATFORM_TEST_DSN: host=postgres port=5432 dbname=platform user=duckfleet password=local-administrator-password
      DUCKFLEET_WORKER_TEST_DSN: host=postgres port=5432 dbname=platform user=duckfleet_worker password=local-platform-worker-password
      DUCKFLEET_GATEWAY_TEST_DSN: host=postgres port=5432 dbname=platform user=duckfleet_gateway password=local-platform-gateway-password
      DUCKFLEET_MAINTAINER_TEST_DSN: host=postgres port=5432 dbname=platform user=duckfleet_maintainer password=local-platform-maintainer-password
      DUCKFLEET_CATALOG_TEST_DSN: host=postgres port=5432 dbname=lake user=duckfleet_catalog password=local-lake-catalog-password
    volumes:
      - ./artifacts:/artifacts
    depends_on:
      server:
        condition: service_healthy

  # The same server, reached by a client that has no dbt installed. A separate image
  # rather than another command on `dbt`, because the absence of dbt is the thing
  # being demonstrated and it cannot be demonstrated from an image that has it.
  api:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/cli.Dockerfile
    environment:
      DUCKFLEET_URL: http://server:8080
      DUCKFLEET_TOKEN: ${DUCKFLEET_TOKEN:-duckfleet-local-development-token}
    volumes:
      - ./artifacts:/artifacts
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  object-data:
