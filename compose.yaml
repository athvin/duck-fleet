name: duckfleet-local
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: duckfleet
      POSTGRES_PASSWORD: local-catalog-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U duckfleet -d lake']
      interval: 2s
      timeout: 3s
      retries: 30

  object-store:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: DUCKFLEETLOCAL
      RUSTFS_SECRET_KEY: local-object-store-password
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes:
      - object-data:/data

  bucket-init:
    build:
      context: .
      dockerfile: docker/s3.Dockerfile
    depends_on: [object-store]

  # The single persistent worker tier (the default size). Sizing a model now
  # derives an isolated pod, which needs Kubernetes, so Compose runs one shared
  # persistent worker; a sized request is refused here with compute_unavailable.
  worker-small:
    image: duckfleet-worker:local
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment: &worker-environment
      DUCKFLEET_TOKEN: ${DUCKFLEET_TOKEN:-duckfleet-local-development-token}
      DUCKFLEET_WORKER_ID: small
      DUCKFLEET_WORKER_CPU: "1"
      DUCKFLEET_WORKER_MEMORY: 1Gi
      DUCKFLEET_WORKER_DISK: 2Gi
      DUCKFLEET_PROFILING: ${DUCKFLEET_PROFILING:-true}
      # Pinned to the defaults so the harness's pricing evidence is deterministic.
      DUCKFLEET_RATE_CARD_VERSION: local-dev-1
      DUCKFLEET_COMPUTE_MICRO_USD_PER_UNIT_HOUR: "100000"
      # A year, so the retention stage can age rows past it while every row the
      # harness itself writes stays comfortably inside it.
      DUCKFLEET_HISTORY_RETENTION_DAYS: "365"
      CATALOG_DSN: host=postgres port=5432 dbname=lake user=duckfleet password=local-catalog-password
      PLATFORM_DSN: host=postgres port=5432 dbname=platform user=duckfleet password=local-catalog-password
      S3_ENDPOINT: object-store:9000
      S3_ACCESS_KEY: DUCKFLEETLOCAL
      S3_SECRET_KEY: local-object-store-password
      S3_DATA_PATH: s3://duckfleet/lake/
    depends_on:
      postgres:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    healthcheck: &worker-health
      test: [CMD, curl, -fsS, http://localhost:8080/healthz]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 10s

  # A second worker of the same size, for the scale-out stage: same resources, its
  # own identity. Behind a profile so the default run keeps exactly one worker and
  # its deterministic placement assertions; the harness brings this up and points
  # the gateway at it via DUCKFLEET_WORKER_URLS.
  worker-small-b:
    profiles: [scale-out]
    image: duckfleet-worker:local
    environment:
      <<: *worker-environment
      DUCKFLEET_WORKER_ID: small-b
    depends_on:
      worker-small:
        condition: service_healthy
    healthcheck: *worker-health
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 10s

  server:
    image: duckfleet-worker:local
    environment:
      DUCKFLEET_ROLE: gateway
      # The wire front is exercised by the harness; the port stays internal.
      DUCKFLEET_PGWIRE: "true"
      PLATFORM_DSN: host=postgres port=5432 dbname=platform user=duckfleet password=local-catalog-password
      DUCKFLEET_TOKEN: ${DUCKFLEET_TOKEN:-duckfleet-local-development-token}
      # The same card the workers price with; the gateway reports it on the budget.
      DUCKFLEET_RATE_CARD_VERSION: local-dev-1
      DUCKFLEET_COMPUTE_MICRO_USD_PER_UNIT_HOUR: "100000"
      # Endpoints, not classes: the gateway asks each worker what resources it has.
      # Overridable so the scale-out stage can add worker-small-b without editing
      # this file; the default is the single persistent worker everything else assumes.
      DUCKFLEET_WORKER_URLS: ${DUCKFLEET_WORKER_URLS:-http://worker-small:8080}
    ports:
      - '127.0.0.1:${DUCKFLEET_PORT:-18080}:8080'
    depends_on:
      worker-small:
        condition: service_healthy
    healthcheck: *worker-health
    mem_limit: 256m
    cpus: 0.5

  dbt:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    environment:
      DUCKFLEET_URL: http://server:8080
      DUCKFLEET_TOKEN: ${DUCKFLEET_TOKEN:-duckfleet-local-development-token}
      # Test-only fault injection for bounded auth reads and revocation while
      # admission waits on a database lock. Never part of the public client API.
      DUCKFLEET_PLATFORM_TEST_DSN: host=postgres port=5432 dbname=platform user=duckfleet password=local-catalog-password
    volumes:
      - ./artifacts:/artifacts
    depends_on:
      server:
        condition: service_healthy

  # The same server, reached by a client that has no dbt installed. A separate image
  # rather than another command on `dbt`, because the absence of dbt is the thing
  # being demonstrated and it cannot be demonstrated from an image that has it.
  api:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/cli.Dockerfile
    environment:
      DUCKFLEET_URL: http://server:8080
      DUCKFLEET_TOKEN: ${DUCKFLEET_TOKEN:-duckfleet-local-development-token}
    volumes:
      - ./artifacts:/artifacts
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  object-data:
