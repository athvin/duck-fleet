apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector: {app: duckfleet-gateway}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: {{ ternary 0 1 .Values.suspended }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: duckfleet-gateway}
  template:
    metadata:
      labels: {app: duckfleet-gateway}
    spec:
      # Identity follows capability: a gateway that creates pods needs a token, and
      # one that cannot must not have one.
      serviceAccountName: {{ ternary "duckfleet-gateway" "duckfleet-no-aws" .Values.isolatedCompute.enabled }}
      nodeSelector: {{ toJson .Values.nodeSelector }}
      securityContext:
        {{- include "duckfleet.podSecurity" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ required "workerImage is required" .Values.workerImage | quote }}
          securityContext:
            {{- include "duckfleet.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 256Mi}
          env:
            - {name: DUCKFLEET_ROLE, value: gateway}
            - name: PLATFORM_DSN
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: PLATFORM_DSN}
            # Endpoints, not classes. The gateway asks each worker what resources it
            # has, because it cannot list pods: the service account mounts no token
            # and the deploy asserts DuckFleet cannot grant itself RBAC.
            - name: DUCKFLEET_WORKER_URLS
              value: {{ include "duckfleet.workerUrls" . | quote }}
            - name: DUCKFLEET_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: DUCKFLEET_TOKEN}
            {{- if .Values.isolatedCompute.enabled }}
            - {name: DUCKFLEET_ISOLATED_POD, value: /etc/duckfleet/pod.json}
            - {name: DUCKFLEET_ISOLATED_READY_SECONDS, value: {{ .Values.isolatedCompute.readySeconds | quote }}}
            # Session pods are owned by this pod, so losing the gateway has the
            # garbage collector remove them rather than leaving them billing.
            - name: DUCKFLEET_POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: DUCKFLEET_POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            {{- end }}
          {{- include "duckfleet.health" . | nindent 10 }}
          {{- if .Values.isolatedCompute.enabled }}
          volumeMounts:
            - {name: isolated-pod, mountPath: /etc/duckfleet, readOnly: true}
      volumes:
        - name: isolated-pod
          configMap: {name: duckfleet-isolated-pod}
          {{- end }}
