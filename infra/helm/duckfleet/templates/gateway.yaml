apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector: {app: duckfleet-gateway}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: {{ ternary 0 1 .Values.suspended }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: duckfleet-gateway}
  template:
    metadata:
      labels: {app: duckfleet-gateway}
    spec:
      serviceAccountName: duckfleet-no-aws
      nodeSelector: {{ toJson .Values.nodeSelector }}
      securityContext:
        {{- include "duckfleet.podSecurity" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ required "workerImage is required" .Values.workerImage | quote }}
          securityContext:
            {{- include "duckfleet.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 256Mi}
          env:
            - {name: DUCKFLEET_ROLE, value: gateway}
            - {name: WORKER_SMALL_URL, value: "http://worker-small:8080"}
            - {name: WORKER_MEDIUM_URL, value: "http://worker-medium:8080"}
            - name: DUCKFLEET_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: DUCKFLEET_TOKEN}
          {{- include "duckfleet.health" . | nindent 10 }}
