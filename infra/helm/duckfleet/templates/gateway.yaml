apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector: {app: duckfleet-gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    {{- if .Values.pgwire.enabled }}
    - {name: pgwire, port: 5432, targetPort: 5432}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  annotations:
    duckfleet.io/platform-schema: {{ include "duckfleet.platformSchema" . | quote }}
  {{- if not .Values.suspended }}
    duckfleet.io/migration-job: {{ include "duckfleet.migrationJob" . | quote }}
  {{- end }}
spec:
  replicas: {{ ternary 0 1 .Values.suspended }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: duckfleet-gateway}
  template:
    metadata:
      annotations:
        duckfleet.io/platform-schema: {{ include "duckfleet.platformSchema" . | quote }}
      labels: {app: duckfleet-gateway}
    spec:
      # The gateway drains like a worker: proxied statements share the same 600-second
      # cap, so the same grace period is what lets one finish. check-chart.py asserts
      # the coupling here as it does for the workers.
      {{- include "duckfleet.termination" . | nindent 6 }}
      # Identity follows capability: a gateway that creates pods needs a token, and
      # one that cannot must not have one.
      serviceAccountName: {{ ternary "duckfleet-gateway" (ternary "duckfleet-results" "duckfleet-no-aws" .Values.results.enabled) .Values.isolatedCompute.enabled }}
      {{- include "duckfleet.placement" . | nindent 6 }}
      securityContext:
        {{- include "duckfleet.podSecurity" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ required "workerImage is required" .Values.workerImage | quote }}
          securityContext:
            {{- include "duckfleet.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 256Mi}
          env:
            - {name: DUCKFLEET_ROLE, value: gateway}
            - {name: DUCKFLEET_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: DUCKFLEET_GATEWAY_MAX_SESSIONS, value: {{ .Values.gatewayMaxSessions | quote }}}
            - {name: DUCKFLEET_ADMISSION_LIMITS_JSON, value: {{ include "duckfleet.admissionConfig" . | quote }}}
            - {name: DUCKFLEET_JOB_POLICY_JSON, value: {{ include "duckfleet.jobPolicy" . | quote }}}
            {{- if .Values.results.enabled }}
            {{- include "duckfleet.resultEnv" . | nindent 12 }}
            - {name: AWS_REGION, value: {{ .Values.region | quote }}}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
            {{- end }}
            - {name: DUCKFLEET_PLATFORM_WAIT_SECONDS, value: {{ .Values.platformWaitSeconds | quote }}}
            - {name: DUCKFLEET_HISTORY_RETENTION_DAYS, value: {{ .Values.historyRetentionDays | quote }}}
            - {name: DUCKFLEET_PGWIRE, value: {{ .Values.pgwire.enabled | quote }}}
            # The same card the workers price with: the gateway reports it on the
            # budget position and settles abandoned session-pod reservations.
            - {name: DUCKFLEET_RATE_CARD_VERSION, value: {{ .Values.rateCard.version | quote }}}
            - {name: DUCKFLEET_COMPUTE_MICRO_USD_PER_UNIT_HOUR, value: {{ .Values.rateCard.computeMicroUsdPerUnitHour | quote }}}
            - name: PLATFORM_DSN
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: PLATFORM_GATEWAY_DSN}
            - name: DUCKFLEET_MAINTENANCE_DSN
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: PLATFORM_MAINTENANCE_DSN}
            - name: DUCKFLEET_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: DUCKFLEET_INTERNAL_TOKEN}
            # Endpoints, not classes. The gateway asks each worker what resources it
            # has, because it cannot list pods: the service account mounts no token
            # and the deploy asserts DuckFleet cannot grant itself RBAC.
            {{- if .Values.persistentPools }}
            - {name: DUCKFLEET_POOLS_FILE, value: /etc/duckfleet-pools/pools.json}
            {{- else }}
            - name: DUCKFLEET_WORKER_URLS
              value: {{ include "duckfleet.workerUrls" . | quote }}
            {{- end }}
            - name: DUCKFLEET_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: DUCKFLEET_TOKEN}
            {{- if .Values.isolatedCompute.enabled }}
            - {name: DUCKFLEET_ISOLATED_POD, value: /etc/duckfleet/pod.json}
            - {name: DUCKFLEET_ISOLATED_READY_SECONDS, value: {{ .Values.isolatedCompute.readySeconds | quote }}}
            - {name: DUCKFLEET_ISOLATED_PROVISIONING_SECONDS, value: {{ .Values.isolatedCompute.provisioningSeconds | quote }}}
            - {name: DUCKFLEET_ISOLATED_QUOTA_WAIT_SECONDS, value: {{ .Values.isolatedCompute.quotaWaitSeconds | quote }}}
            # Session pods are owned by this pod, so losing the gateway has the
            # garbage collector remove them rather than leaving them billing.
            - name: DUCKFLEET_POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: DUCKFLEET_POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            {{- end }}
          {{- include "duckfleet.health" . | nindent 10 }}
          {{- if or .Values.isolatedCompute.enabled .Values.persistentPools }}
          volumeMounts:
            {{- if .Values.isolatedCompute.enabled }}
            - {name: isolated-pod, mountPath: /etc/duckfleet, readOnly: true}
            {{- end }}
            {{- if .Values.persistentPools }}
            # A directory projection allows atomic ConfigMap updates. No checksum
            # annotation: an explicit /v1/pools/reload must preserve live sessions.
            - {name: persistent-pools, mountPath: /etc/duckfleet-pools, readOnly: true}
            {{- end }}
      volumes:
        {{- if .Values.isolatedCompute.enabled }}
        - name: isolated-pod
          configMap: {name: duckfleet-isolated-pod}
        {{- end }}
        {{- if .Values.persistentPools }}
        - name: persistent-pools
          configMap: {name: duckfleet-pools}
        {{- end }}
          {{- end }}
