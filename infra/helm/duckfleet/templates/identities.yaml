{{- /*
Deploys only into namespaces DuckFleet plainly owns. Exact duckfleet-dev until
team namespaces existed; the prefix keeps what the restriction was for — a
render can never land in a neighbour's namespace on a shared cluster — while
letting the provisioning script stamp out duckfleet-<team> namespaces.
check-infra proves a foreign namespace still refuses to render.
*/ -}}
{{- if not (hasPrefix "duckfleet-" .Release.Namespace) }}
{{- fail "This chart deploys only into duckfleet-* namespaces" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: duckfleet-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: duckfleet-no-aws
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: duckfleet-reader
automountServiceAccountToken: false
---
# The one identity here that holds a token, and the only one the gateway uses when
# isolated compute is wired up; otherwise it uses duckfleet-results when enabled
# or duckfleet-no-aws, both without a Kubernetes token. Created by the chart because the deploy identity may create
# ServiceAccounts — what it may not create is the Role that makes this one useful, so
# that lives in infra/kubernetes/boundary and an operator applies it.
#
# Rendered unconditionally so the gateway pod can always start: a ServiceAccount the
# deployment referenced but nothing created would leave the pod unable to mount its
# token, which is a stuck pod rather than the clean refusal this is meant to degrade
# to. Unused, it grants nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: duckfleet-gateway
automountServiceAccountToken: true

---
# Result-prefix AWS credentials without Kubernetes API capabilities. A gateway
# using isolated compute instead keeps duckfleet-gateway and its explicit RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: duckfleet-results
automountServiceAccountToken: false
