{{- range $size, $declared := include "duckfleet.workerClasses" . | fromYaml }}
{{- /* fromYaml routes through JSON, so a class size arrives as a float. */}}
{{- $cpu := int $declared }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker-{{ $size }}
spec:
  selector: {app: duckfleet-worker, size: {{ $size }}}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-{{ $size }}
spec:
  # No concurrent writers with the same worker identity during upgrades.
  replicas: {{ ternary 0 1 $.Values.suspended }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: duckfleet-worker, size: {{ $size }}}
  template:
    metadata:
      labels: {app: duckfleet-worker, size: {{ $size }}}
    spec:
      {{- include "duckfleet.termination" . | nindent 6 }}
      serviceAccountName: duckfleet-worker
      nodeSelector: {{ toJson $.Values.nodeSelector }}
      securityContext:
        {{- include "duckfleet.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ required "workerImage must be an immutable ECR digest" $.Values.workerImage | quote }}
          securityContext:
            {{- include "duckfleet.containerSecurity" . | nindent 12 }}
          resources:
            # The cgroup quota the worker asserts comes from the CPU *limit*, so the
            # limit is always the exact class size. The request may sit lower to fit
            # constrained capacity; memory stays requests == limits because memory is
            # not compressible.
            requests: {cpu: {{ dig $size $cpu ($.Values.workerCpuRequests | default dict) | quote }}, memory: {{ printf "%dGi" $cpu }}, ephemeral-storage: 2Gi}
            limits: {cpu: {{ $cpu | quote }}, memory: {{ printf "%dGi" $cpu }}, ephemeral-storage: 3Gi}
          env:
            {{- include "duckfleet.workerEnv" (dict "root" $ "id" $size "cpu" $cpu "memory" (printf "%dGi" $cpu)) | nindent 12 }}
          {{- include "duckfleet.health" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}
{{- end }}
