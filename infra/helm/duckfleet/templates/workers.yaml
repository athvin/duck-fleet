{{- range $size, $pool := include "duckfleet.pools" . | fromJson }}
{{- $cpu := int $pool.cpu }}
{{- range $index := until (int $pool.workers) }}
{{- $id := include "duckfleet.workerId" (dict "pool" $size "index" $index) }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker-{{ $id }}
spec:
  # worker-index pins the Service to exactly one replica's pod. Sessions are pinned
  # by endpoint, so a Service balancing across siblings would move a session's
  # statements between engines mid-transaction.
  selector: {app: duckfleet-worker, size: {{ $size }}, worker-index: {{ $index | quote }}}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-{{ $id }}
  annotations:
    duckfleet.io/platform-schema: {{ include "duckfleet.platformSchema" $ | quote }}
spec:
  # No concurrent writers with the same worker identity during upgrades.
  replicas: {{ include "duckfleet.initialWorkerReplicas" (dict "root" $ "pool" $size "index" $index) }}
  strategy: {type: Recreate}
  selector:
    {{- if and (eq $size "small") (eq $index 0) }}
    {{- /* The legacy selector, verbatim: a Deployment's selector is immutable, so
           adding worker-index here would fail every in-place upgrade. Siblings carry
           controller references, so the looser match adopts nothing of theirs. */}}
    matchLabels: {app: duckfleet-worker, size: {{ $size }}}
    {{- else if eq $size "small" }}
    matchLabels: {app: duckfleet-worker, size: {{ $size }}, worker-index: {{ $index | quote }}}
    {{- else }}
    matchLabels: {app: duckfleet-worker, duckfleet-pool: {{ $size }}, worker-index: {{ $index | quote }}}
    {{- end }}
  template:
    metadata:
      annotations:
        duckfleet.io/platform-schema: {{ include "duckfleet.platformSchema" $ | quote }}
      labels: {app: duckfleet-worker, size: {{ $size }}, duckfleet-pool: {{ $size }}, worker-index: {{ $index | quote }}}
    spec:
      {{- include "duckfleet.termination" . | nindent 6 }}
      serviceAccountName: {{ ternary "duckfleet-reader" "duckfleet-worker" (eq $pool.authority "reader") }}
      {{- include "duckfleet.placement" $ | nindent 6 }}
      securityContext:
        {{- include "duckfleet.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ required "workerImage must be an immutable ECR digest" $.Values.workerImage | quote }}
          securityContext:
            {{- include "duckfleet.containerSecurity" . | nindent 12 }}
          resources:
            # The cgroup quota the worker asserts comes from the CPU *limit*, so the
            # limit is always the exact class size. The request may sit lower to fit
            # constrained capacity; memory stays requests == limits because memory is
            # not compressible.
            requests: {cpu: {{ $cpu | quote }}, memory: {{ $pool.memory | quote }}, ephemeral-storage: {{ $pool.disk | quote }}}
            limits: {cpu: {{ $cpu | quote }}, memory: {{ $pool.memory | quote }}, ephemeral-storage: {{ include "duckfleet.diskLimit" $pool.disk | quote }}}
          env:
            {{- include "duckfleet.workerEnv" (dict "root" $ "id" $id "pool" $size "cpu" $cpu "memory" $pool.memory "disk" $pool.disk "maxSessions" $pool.maxSessionsPerWorker "authority" $pool.authority "engine" ($pool.engine | default dict)) | nindent 12 }}
          {{- include "duckfleet.health" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ $pool.disk | quote }}}
{{- end }}
{{- end }}
