{{/*
Reaching the API from outside the cluster, rendered only when asked for. The facts
that have to be named before anything renders each belong to the operator, and a
default would invent them: the host, how TLS is terminated, and where traffic to
the gateway comes from. The isolation NetworkPolicy admits only this namespace's
pods, so an unnamed source would produce an Ingress that cannot reach the gateway.

Two shapes:
  - an in-cluster ingress controller: TLS from a kubernetes.io/tls Secret, traffic
    from the controller's namespace;
  - a cloud load balancer (exposure.loadBalancer): TLS terminated by the load
    balancer with a certificate its class names, traffic from VPC ranges.

TLS comes before credentials: a bearer token must never cross plain HTTP. With a
controller, the tls block is unconditional and the redirect annotation is the
nginx-family spelling of "refuse plain HTTP". With a load balancer, the only
listener is HTTPS:443, so there is no plain-HTTP port to refuse.
*/}}
{{- if .Values.exposure.enabled -}}
{{- $host := required "exposure.host is required when exposure is enabled" .Values.exposure.host -}}
{{- $lb := .Values.exposure.loadBalancer | default dict -}}
{{- $annotations := dict -}}
{{- if $lb.enabled }}
{{- if not $lb.sourceCidrs }}{{ fail "exposure.loadBalancer.sourceCidrs is required: traffic is admitted from ranges an operator names, never from everywhere" }}{{ end }}
{{- $_ := required "exposure.ingressClassName is required: the load balancer's class carries its certificate" .Values.exposure.ingressClassName -}}
{{- $annotations = merge .Values.exposure.annotations (dict
    "alb.ingress.kubernetes.io/listen-ports" "[{\"HTTPS\":443}]"
    "alb.ingress.kubernetes.io/target-type" "ip"
    "alb.ingress.kubernetes.io/healthcheck-path" "/healthz"
    "alb.ingress.kubernetes.io/success-codes" "200") -}}
{{- else }}
{{- $_ := required "exposure.tlsSecretName is required: the chart never mints certificates" .Values.exposure.tlsSecretName -}}
{{- $_ := required "exposure.controllerNamespace is required: traffic is admitted from a namespace an operator names, never from everywhere" .Values.exposure.controllerNamespace -}}
{{- $annotations = merge .Values.exposure.annotations (dict "nginx.ingress.kubernetes.io/ssl-redirect" "true") -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duckfleet
  annotations:
    {{- range $key, $value := $annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- with .Values.exposure.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if not $lb.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ .Values.exposure.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: server, port: {number: 8080}}}
---
# The isolation policy admits only this namespace's pods, so the exposure needs its
# own narrow door: the named source, the gateway pod, port 8080, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: duckfleet-exposure
spec:
  podSelector:
    matchLabels: {app: duckfleet-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if $lb.enabled }}
        {{- range $lb.sourceCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
        {{- else }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.exposure.controllerNamespace }}}
        {{- end }}
      ports: [{port: 8080}]
{{- end -}}
