{{/*
On-demand compute: one pod per session, with the resources the caller asked for.

Everything here renders only when `isolatedCompute.enabled` is true, because the
gateway cannot create pods without RBAC and `scripts/aws/check-access.sh` asserts the
deploy identity *cannot* grant it — failing the deploy if that permission ever
appears. Rendering a Role unconditionally would therefore break every deploy into a
namespace DuckFleet does not own. Where this is off, `compute: isolated` is refused
with `compute_unavailable` and no statement runs. See #39.
*/}}
{{- if .Values.isolatedCompute.enabled }}
{{- if not .Values.isolatedCompute.apiServerCidrs }}
{{- fail "isolatedCompute.enabled requires apiServerCidrs: the gateway cannot reach the Kubernetes API, and leaving it unset would open egress rather than fail" }}
{{- end }}
{{- if not .Values.isolatedCompute.apiServerPorts }}
{{- fail "isolatedCompute.enabled requires apiServerPorts: the API server's endpoint port is not always 443, and an empty list would render a rule matching every port" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: duckfleet-gateway
# The one identity in this release that holds a token. The workers and the default
# gateway identity mount none.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: duckfleet-isolated-pods
# Pods in this namespace and nothing else. Notably absent: secrets, which the pods
# read through the kubelet rather than through the gateway; and roles/rolebindings,
# so the gateway cannot widen its own grant.
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: duckfleet-isolated-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: duckfleet-isolated-pods
subjects:
  - kind: ServiceAccount
    name: duckfleet-gateway
    namespace: {{ .Release.Namespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: duckfleet-gateway-kubernetes
spec:
  podSelector:
    matchLabels: {app: duckfleet-gateway}
  policyTypes: [Egress]
  egress:
    # Only the gateway, and only the API server. The blanket isolation policy denies
    # this otherwise, which presents as a timeout rather than a denial.
    #
    # These must describe the API server's *endpoints*, not its Service address. Egress
    # policy is evaluated after kube-proxy has rewritten the destination, so traffic a
    # pod sends to the ClusterIP on 443 is matched against the endpoint address and
    # port — on kind, 6443 at the node's address. A rule written against the ClusterIP
    # matches nothing and denies the gateway, which is why the port is configured here
    # rather than fixed at 443, and why a preflight asserts the configured values
    # actually cover the cluster's endpoints.
    - to:
        {{- range .Values.isolatedCompute.apiServerCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range .Values.isolatedCompute.apiServerPorts }}
        - {port: {{ . }}}
        {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: duckfleet-isolated-pod
# The pod the gateway creates, rendered by the chart rather than built in code, so
# the image digest, security context, node placement and secret wiring stay in one
# place and cannot drift from the persistent workers. The gateway patches only
# identity, resources and the owner reference; it is mounted as a file, so reading it
# needs no RBAC of its own.
data:
  pod.json: {{ include "duckfleet.isolatedPod" . | fromYaml | toJson | quote }}
{{- end }}
