{{/*
The bundled PostgreSQL: a development fixture — one replica, one PVC, no HA.
postgres.bundled=false removes all of it, for a deployment whose Secret DSNs
point at a server the operator runs (RDS, or any PostgreSQL); the release
itself never needed to know where the catalog lives, only the DSNs do.
*/}}
{{- if .Values.postgres.bundled -}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: duckfleet-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: duckfleet-postgres-init
data:
  init.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -X -q -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres --file /etc/duckfleet/provision-database.sql
  provision-database.sql: |
{{ .Files.Get "files/provision-database.sql" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: duckfleet-postgres
spec:
  serviceName: postgres
  replicas: {{ ternary 0 1 .Values.suspended }}
  selector:
    matchLabels: {app: duckfleet-postgres}
  template:
    metadata:
      labels: {app: duckfleet-postgres}
    spec:
      serviceAccountName: duckfleet-no-aws
      {{- include "duckfleet.placement" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17.6-bookworm
          args: ["-c", "max_locks_per_transaction=1024"]
          securityContext:
            {{- include "duckfleet.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          env:
            - {name: POSTGRES_USER, value: duckfleet}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            {{- include "duckfleet.databaseProvisionEnvironment" . | nindent 12 }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec: {command: [pg_isready, -U, duckfleet, -d, lake]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: provisioning, mountPath: /etc/duckfleet, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: init
          configMap:
            name: duckfleet-postgres-init
            items: [{key: init.sh, path: init.sh}]
        - name: provisioning
          configMap:
            name: duckfleet-postgres-init
            items: [{key: provision-database.sql, path: provision-database.sql}]
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: 10Gi}
{{- end -}}
