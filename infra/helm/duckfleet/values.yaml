# Generated immutable image digests are supplied by scripts/aws/publish.sh.
workerImage: ""
dbtImage: ""
bucket: duckfleet
region: us-east-1
secretName: duckfleet
# Empty entries derive distinct namespace-scoped names. Provision roles separately;
# the migration login owns platform objects but never receives CREATEROLE.
databaseRoles: {}
# Render the administrator-only provisioning Job only through the explicit legacy
# database upgrade helper. Ordinary releases must never adopt database ownership.
legacyDatabaseUpgrade: false
authorization:
  # Reviewed seed for existing/new analysts, not a grant for every pool. Repeated
  # migrations preserve revoked grants. Custom defaults must set this explicitly.
  defaultPersistentGrant: {pool: small, cpu: 1, memory: 1Gi, disk: 2Gi}
storageClass: standard
# Where pods run. EKS Auto Mode nodes, on whatever pool the cluster offers.
#
# DuckFleet has a node pool of its own in infra/kubernetes/boundary/eks, and pinning it
# is what stops DuckFleet drawing on a neighbour's capacity and being bounded by sizing
# decisions made for something else. It is *not* pinned here, deliberately: the chart
# default must render anywhere, and that pool is cluster-scoped, so a default that
# selected it would leave every pod Pending on any cluster that lacks it.
#
# The pin is a deploy-time overlay instead (`duckfleet-ops aws-deploy-values`), applied once
# the ownership boundary exists — `scripts/aws/apply-boundary.sh` first. The overlay
# adds `karpenter.sh/nodepool: duckfleet` here, the matching toleration below (the pool
# is tainted; `duckfleet-ops check-chart` fails a render where one appears without the other), and
# raises the medium worker's request to its full 2 CPU, retiring the shared-pool shim.
# It is bundled with enabling isolated compute, whose apiServerCidrs likewise cannot be
# a chart default — both are facts about the cluster, not the chart (duck-fleet#39).
nodeSelector:
  kubernetes.io/os: linux

# What would let these pods onto the DuckFleet pool, which is tainted so nothing else
# can land there. Empty while the selector above does not name that pool: emitted
# together by `duckfleet.placement`, and asserted to agree, because a selector without
# the toleration never schedules and a toleration without the selector would let a
# DuckFleet pod consume a neighbour's node.
tolerations: []

# Pause compute after testing; the PostgreSQL PVC and S3 data remain.
suspended: false
# Optional two-gateway rolling availability with durable lease/fenced ownership.
highAvailability:
  enabled: false

profiling: true
# Percentage of sessions whose raw profiles persist; metrics are still captured.
# 100 preserves existing behavior. Open context {"profile":"debug"} overrides sampling.
profileSamplePercent: 100
# Independent artifact expiry; 0 preserves each artifact forever.
sqlRetentionDays: 0
profileRetentionDays: 0

# A worker reports not-ready while it waits for the catalog, so this must stay inside
# the startup probe budget (failureThreshold 120 at 5s). The probe, not this value,
# is what finally replaces a pod whose catalog never appears.
catalogWaitSeconds: 120

# Workers and the gateway wait for an explicit migration to publish a compatible
# platform schema; an isolated worker never performs shared migrations itself.
platformWaitSeconds: 120
platformMigration:
  # Increment after a restore/reset or a PLATFORM_DSN retarget, even with the same
  # image and Secret name. Deploy/provision scripts supply a fresh run identity.
  runId: ""
  timeoutSeconds: 240
  prepaidMicroUsd: 10000000
  maxJobMicroUsd: 1000000

# What one normalized compute unit (max of vCPU and GiB/4) costs per hour, in whole
# micro-USD, and the version stamped on every event priced with it. Cost attribution
# in the operator's own numbers: the default is the development placeholder, and the
# measured economics (#18) are what should replace it. Change both together — each
# reservation copies the pair at admission, so a change reprices only new work and
# the append-only ledger keeps the rate every event was actually charged at.
rateCard:
  version: local-dev-1
  computeMicroUsdPerUnitHour: 100000

# Days of query history to keep; 0 keeps everything, and is the default — history
# rows carry SQL text and profiles, so throwing them away is an operator's
# decision, never a default's. The usage ledger has no retention at all: it is
# billing evidence, and a pruned query's event remains the proof of what ran and
# what it cost. The gateway coordinates bounded maintenance; workers do not sweep.
historyRetentionDays: 0

# The bundled PostgreSQL is a development fixture: one replica, one PVC, no HA.
# A self-hoster running DuckFleet as their warehouse should set bundled: false
# and point the Secret's CATALOG_DSN and PLATFORM_DSN at managed PostgreSQL —
# the catalog is the write-coordination point for the whole lake, and deserves a
# server with its own availability and backup story. scripts/backup-catalog.sh
# and restore-catalog.sh are how data moves between the two. A database outside
# the namespace also needs its address in externalCidrs: the isolation policy
# otherwise permits 5432 only between this namespace's own pods, and an
# unreachable catalog presents as workers that never become ready.
postgres:
  bundled: true
  externalCidrs: []
  port: 5432

# Where this namespace's Parquet lives inside the bucket. The provisioning script
# sets it to <namespace>/lake so team namespaces never share a prefix; the
# default keeps the primary deployment exactly where it has always been. On AWS
# the worker IAM policy should be scoped to the same prefix — that policy is the
# storage half of namespace isolation, and it lives with whoever owns IAM.
lakePrefix: lake

# Enable after installing result-prefix Pod Identity for both worker and gateway.
# This prefix must be separate from lakePrefix (neither may contain the other).
# Provisioned team namespaces use <namespace>/results, with matching IAM grants.
results:
  enabled: false
  prefix: results

# Optional operator ceilings/defaults/isolated envelope, using the runtime JSON
# field names. Empty retains runtime3600/result1GiB/10Mrows/TTL24h ceilings;
# defaults runtime300/TTL1h/queue120. Analyst grant omission still caps runtime60.
# Each supplied envelope is complete; per-pool jobLimits may lower it separately.
jobPolicy: {}

# Optional deployment/principal compute ceilings and lifecycle deadlines. Empty
# preserves fixed-capacity admission with no additional limits. Values use runtime
# JSON field names. Idle timeout applies only with no active query; maximum
# lifetime interrupts active work and rolls its session back on close.
computePolicy: {}
# Optional per-pool bounded autoscaling; empty preserves fixed-capacity workers.
autoscaling: {}
# Example:
# computePolicy:
#   max_cpu: 8
#   max_memory_bytes: 17179869184
#   max_disk_bytes: 34359738368
#   max_principal_cpu: 2
#   max_principal_memory_bytes: 4294967296
#   max_principal_disk_bytes: 8589934592
#   idle_timeout_seconds: 300
#   max_lifetime_seconds: 1800

# The Postgres wire-protocol front: psql and simple-protocol drivers speak to
# the gateway on 5432 with a platform credential as the password, through the
# same sessions, principals, and meters as everything else. Off by default —
# it is a compatibility surface, and a deployment that does not use it should
# not listen for it. In-cluster plain TCP: transport security stays with the
# exposure layer, and the in-namespace NetworkPolicy already admits 5432.
pgwire:
  enabled: false

# Reaching the API from outside the cluster: an Ingress terminating TLS at the
# controller, plus the NetworkPolicy door that admits the controller's namespace.
# Off by default and off in the dev lane permanently. Enabling it requires naming
# the host, the kubernetes.io/tls Secret an operator created in this namespace,
# and the namespace the ingress controller runs in — each is a fact about a
# cluster this chart does not own, and a default would invent it. A bearer token
# must never cross plain HTTP: the render always carries the TLS block and the
# nginx-family ssl-redirect annotation; a different controller's operator owns
# configuring its equivalent via `annotations`.
exposure:
  enabled: false
  host: ""
  tlsSecretName: ""
  ingressClassName: ""
  controllerNamespace: ""
  annotations: {}

# Empty preserves the historical small pool and worker-small[-N] identities.
# Set named pools to size CPU, memory, and spill disk independently. Configuration
# changes affect new opens after POST /v1/pools/reload; resizing a worker replaces
# its process, so drain existing sessions first.
defaultPool: small
persistentPools: {}
# Example:
# persistentPools:
#   small: {cpu: 1, memory: 1Gi, disk: 2Gi, workers: 1}
#   interactive: {cpu: 2, memory: 3Gi, disk: 4Gi, workers: 2, maxSessionsPerWorker: 32}
# Each pool may also specify a complete jobLimits envelope (snake_case fields).
# authority defaults to writer. A reader pool uses only CATALOG_READER_DSN and the
# duckfleet-reader Pod Identity; provision both before declaring it. Example:
#   small-reader: {cpu: 1, memory: 1Gi, disk: 2Gi, workers: 1, authority: reader}
# Deprecated legacy-only override. An empty map still means one small worker.
# Clear inherited workerReplicas before adopting persistentPools with --reuse-values.
workerReplicas: {}
workerMaxSessions: 32
workerQueueCapacity: 64
# Durable waiting SQL bounds, separate from the operations channel above.
workerMaxQueuedQueries: 64
workerMaxQueuedBytes: 16777216
gatewayMaxSessions: 64
# Optional default/isolated policy overrides; named pools may also set admission.
# Each object accepts maxQueuedQueries (256), maxRunningQueries (16),
# maxQueuedPerPrincipal (16), and maxRunningPerPrincipal (inherits pool running).
admissionLimits: {}

# Where cluster DNS may be reached, by address, because it cannot be selected by pod
# on every topology. Deliberately the service and VPC ranges rather than 0.0.0.0/0:
# opening port 53 generally is the usual shortcut, and it would permit resolution
# against an external server, which is a data path out of a SQL engine.
#
# The resolver is the .10 of the service CIDR; the VPC range covers a node-local
# listener. A preflight asserts the cluster's own service CIDR is covered here, so
# narrowing this or pointing the deploy at a differently addressed cluster fails
# before the release is applied.
dnsEgressCidrs:
  - 172.20.0.0/16
  - 10.0.0.0/16

# On-demand compute: a pod per session, sized to the request.
#
# This wires the deployment for it; it does not grant it. The Role that lets the
# gateway create pods lives in infra/kubernetes/boundary and an operator applies it,
# because the deploy identity cannot create Roles and check-access.sh fails the deploy
# if it ever can. So turning this on where the boundary has not been applied is safe
# but inert: the gateway asks the API server whether it holds the grant and reports the
# answer, and the deploy warns rather than claiming the feature shipped (#39).
#
# Off here until the boundary is applied to the development cluster. Where it is off —
# or on without the grant — `compute: isolated` returns compute_unavailable, no
# statement runs, and the request is never downgraded to a shared worker.
isolatedCompute:
  enabled: false
  # Hard ceiling on a session pod's life, enforced by the kubelet rather than by the
  # gateway, so a pod cannot outlive the gateway that forgot it. Well above the 60s
  # statement timeout: this bounds leaks, it does not time out queries.
  maxSessionSeconds: 1800
  # How long to wait for a pod to become ready before giving up and deleting it.
  readySeconds: 120
  # How long a session pod may sit Unschedulable before that is taken as terminal.
  # Zero on a fixed-node cluster, where a pod is either placeable at once or never, so
  # the gateway refuses an unplaceable size immediately and names the shortfall. On a
  # cluster that adds nodes on demand (EKS Auto Mode / Karpenter) a pod is routinely
  # Unschedulable for the seconds a new node takes to join, so the deploy raises this
  # (see `duckfleet-ops aws-deploy-values`): without the wait the gateway deletes the pod
  # before Karpenter can provision for it, and no isolated session places (#90).
  provisioningSeconds: 0
  # How long a pod create refused by the namespace quota is retried before the refusal
  # is relayed. Separate from provisioningSeconds, which is a node-model property and
  # deliberately zero on fixed nodes: quota occupancy is transient on every cluster,
  # because a closed session's pod counts against count/pods while it is Terminating,
  # so back-to-back isolated opens hit a full quota that clears within the pod's
  # termination grace (#94). The default covers that grace; a request the quota could
  # never fit, even empty, is still refused at once. Zero restores relay-immediately.
  quotaWaitSeconds: 90
  # The largest size one node of the cluster can allocate to a session pod. A request
  # above either is refused at once with both sizes named, rather than created and left
  # Pending until provisioningSeconds runs out. Zero / empty means no ceiling, which
  # suits a fixed-node cluster, where the scheduler's own verdict is already
  # immediate. The AWS deploy sets these to what the duckfleet NodePool's largest
  # instance can allocate (#214).
  maxCpu: 0
  maxMemory: ""
  # Where the Kubernetes API server may be reached, and on which port. Both required
  # when enabled: defaulting them would mean opening egress to reach an address nobody
  # declared.
  #
  # These describe the API server's *endpoints*, not its Service address. Egress policy
  # is evaluated after kube-proxy rewrites the destination, so a rule written against
  # the ClusterIP matches nothing — which denied the gateway outright the first time
  # the local harness enforced policy at all. ``duckfleet-ops aws-check-api-egress``
  # asserts these cover the cluster's real endpoints before a release is applied.
  apiServerCidrs: []
  apiServerPorts: [443]
