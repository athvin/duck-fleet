worker_processes 1;
events { worker_connections 256; }
http {
  server {
    listen 9443 ssl;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    # Unbounded and unbuffered: lake files and results stream straight through.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    location / {
      proxy_pass http://object-store:9000;
      # SigV4 signs the Host the client used; RustFS must see that same Host.
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_read_timeout 600s;
    }
  }
}
